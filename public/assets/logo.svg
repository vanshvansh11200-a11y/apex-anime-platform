<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="apexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E93" />
      <stop offset="50%" stop-color="#FF5E62" />
      <stop offset="100%" stop-color="#FF9900" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#00f5d4" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Icon: Futuristic Japanese Cyberpunk Triangle / Play Glyph -->
  <polygon points="40,15 85,85 15,85" fill="url(#apexGrad)" filter="url(#neonGlow)" />
  <polygon points="40,32 70,80 25,80" fill="#0d0e15" />
  <polygon points="40,42 60,74 30,74" fill="url(#glowGrad)" />

  <!-- Brand Typography -->
  <text x="105" y="72" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="4">APEX</text>
  <text x="250" y="44" font-family="'Outfit', 'Inter', sans-serif" font-weight="700" font-size="13" fill="#FF2E93" letter-spacing="3">STREAM</text>
  <circle cx="240" cy="40" r="3" fill="#00f5d4" />
</svg>
