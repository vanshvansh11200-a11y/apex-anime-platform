services:
  - type: web
    name: apex-anime-platform
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_DEFAULT_EMAIL
        value: admin@apex.stream
      - key: ADMIN_DEFAULT_PASSWORD
        value: Admin123!
      - key: DATA_DIR
        value: ./data
      - key: DATABASE_FILE
        value: ./data/apex.db.json
